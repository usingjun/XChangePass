networks:
  transaction-statistics-replica:
    driver: bridge

services:
  postgres-primary:
    image: postgres:15
    container_name: xchangepass-statistics-primary
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: ${LOCAL_REPLICA_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${LOCAL_REPLICA_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${LOCAL_REPLICA_POSTGRES_DB:-xchangepass}
      POSTGRES_REPLICATION_USER: ${LOCAL_REPLICA_POSTGRES_REPLICATION_USER:-repl_user}
      POSTGRES_REPLICATION_PASSWORD: ${LOCAL_REPLICA_POSTGRES_REPLICATION_PASSWORD:-repl_password}
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
    volumes:
      - transaction_statistics_primary_data:/var/lib/postgresql/data
      - ./postgres/primary-init:/docker-entrypoint-initdb.d:ro
    networks:
      - transaction-statistics-replica
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_REPLICA_POSTGRES_USER:-postgres} -d ${LOCAL_REPLICA_POSTGRES_DB:-xchangepass}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-replica:
    image: postgres:15
    container_name: xchangepass-statistics-replica
    depends_on:
      postgres-primary:
        condition: service_healthy
    ports:
      - "15433:5432"
    environment:
      PGUSER: ${LOCAL_REPLICA_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${LOCAL_REPLICA_POSTGRES_PASSWORD:-postgres}
      POSTGRES_REPLICATION_USER: ${LOCAL_REPLICA_POSTGRES_REPLICATION_USER:-repl_user}
      POSTGRES_REPLICATION_PASSWORD: ${LOCAL_REPLICA_POSTGRES_REPLICATION_PASSWORD:-repl_password}
    volumes:
      - transaction_statistics_replica_data:/var/lib/postgresql/data
    networks:
      - transaction-statistics-replica
    entrypoint:
      - "bash"
      - "-c"
      - |
        set -e
        if [ ! -s "$$PGDATA/PG_VERSION" ]; then
          rm -rf "$$PGDATA"/*
          until pg_isready -h postgres-primary -p 5432; do
            sleep 1
          done
          PGPASSWORD="$$POSTGRES_REPLICATION_PASSWORD" pg_basebackup \
            -h postgres-primary \
            -p 5432 \
            -D "$$PGDATA" \
            -U "$$POSTGRES_REPLICATION_USER" \
            -Fp \
            -Xs \
            -P \
            -R
          chown -R postgres:postgres "$$PGDATA"
        fi
        exec docker-entrypoint.sh postgres -c hot_standby=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_REPLICA_POSTGRES_USER:-postgres} -d ${LOCAL_REPLICA_POSTGRES_DB:-xchangepass}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  transaction_statistics_primary_data:
  transaction_statistics_replica_data:
