networks:
  transaction-statistics-replica:
    driver: bridge

services:
  postgres-primary:
    image: bitnami/postgresql:15
    container_name: xchangepass-statistics-primary
    ports:
      - "15432:5432"
    environment:
      POSTGRESQL_REPLICATION_MODE: master
      POSTGRESQL_REPLICATION_USER: ${LOCAL_REPLICA_POSTGRES_REPLICATION_USER:-repl_user}
      POSTGRESQL_REPLICATION_PASSWORD: ${LOCAL_REPLICA_POSTGRES_REPLICATION_PASSWORD:-repl_password}
      POSTGRESQL_USERNAME: ${LOCAL_REPLICA_POSTGRES_USER:-postgres}
      POSTGRESQL_PASSWORD: ${LOCAL_REPLICA_POSTGRES_PASSWORD:-postgres}
      POSTGRESQL_DATABASE: ${LOCAL_REPLICA_POSTGRES_DB:-xchangepass}
    volumes:
      - transaction_statistics_primary_data:/bitnami/postgresql
    networks:
      - transaction-statistics-replica
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_REPLICA_POSTGRES_USER:-postgres} -d ${LOCAL_REPLICA_POSTGRES_DB:-xchangepass}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-replica:
    image: bitnami/postgresql:15
    container_name: xchangepass-statistics-replica
    depends_on:
      postgres-primary:
        condition: service_healthy
    ports:
      - "15433:5432"
    environment:
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_MASTER_HOST: postgres-primary
      POSTGRESQL_MASTER_PORT_NUMBER: 5432
      POSTGRESQL_REPLICATION_USER: ${LOCAL_REPLICA_POSTGRES_REPLICATION_USER:-repl_user}
      POSTGRESQL_REPLICATION_PASSWORD: ${LOCAL_REPLICA_POSTGRES_REPLICATION_PASSWORD:-repl_password}
      POSTGRESQL_PASSWORD: ${LOCAL_REPLICA_POSTGRES_PASSWORD:-postgres}
    volumes:
      - transaction_statistics_replica_data:/bitnami/postgresql
    networks:
      - transaction-statistics-replica
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_REPLICA_POSTGRES_USER:-postgres} -d ${LOCAL_REPLICA_POSTGRES_DB:-xchangepass}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  transaction_statistics_primary_data:
  transaction_statistics_replica_data:
